<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Moved: Let Africa Build Investor Brief</title>
  <!--
    This copy is retired. The brief lives at letafricabuild.com/brief now, in
    the website's own repository, so there is one document rather than two that
    drift apart.

    A meta refresh rather than a real redirect, because GitHub Pages serves
    static files and cannot issue a 301. The link below is the fallback for
    anyone whose browser blocks the refresh, and for people reading with
    JavaScript off.

    noindex here as well as at the destination: the brief is unlisted, so a
    signpost to it should not be indexed either.
  -->
  <meta http-equiv="refresh" content="0; url=https://letafricabuild.com/brief">
  <link rel="canonical" href="https://letafricabuild.com/brief">
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: #07070A; color: #F4F1EA; padding: 40px;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      text-align: center; line-height: 1.6;
    }
    .mark { width: 56px; height: 56px; margin: 0 auto 28px; }
    h1 { font-size: 22px; font-weight: 500; margin: 0 0 12px; letter-spacing: -0.01em; }
    p { margin: 0 0 24px; font-size: 15px; font-weight: 300; color: rgba(244,241,234,.6); max-width: 42ch; }
    a {
      display: inline-block; color: #07070A; background: #F7931A; text-decoration: none;
      padding: 14px 26px; border-radius: 999px; font-size: 12px;
      letter-spacing: .12em; text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div>
    <svg class="mark" viewBox="-0.1 -0.1 3.2 3.2" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path fill="#F7931A" d="M0 0 H2 V1 H1 V2 H0 Z"/>
      <path fill="#F4F1EA" d="M2 1 H3 V3 H1 V2 H2 Z"/>
    </svg>
    <h1>The investor brief has moved</h1>
    <p>It now lives on letafricabuild.com. You should be redirected automatically.</p>
    <a href="https://letafricabuild.com/brief">Read the brief</a>
  </div>
</body>
</html>
